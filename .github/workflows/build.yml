# Compila la app para Android, Linux, Windows y macOS. En cada etiqueta `v*`
# publica además un release de GitHub con los cuatro paquetes.
#
# Firma del APK (opcional): con los secretos ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD el APK
# sale firmado con la clave de publicación; sin ellos, con la de depuración.
# Los paquetes de macOS y Windows no van firmados.
name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      number: ${{ steps.v.outputs.number }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dev"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Clave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > app/android/app/lacre.jks
          cat > app/android/key.properties <<EOF
          storeFile=lacre.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Compilar APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release \
            --target-platform android-arm64,android-arm,android-x64 \
            --build-name "${{ needs.version.outputs.name }}" \
            --build-number "${{ needs.version.outputs.number }}"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../dist/lacre-${{ needs.version.outputs.name }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Compilar
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release \
            --build-name "${{ needs.version.outputs.name }}" \
            --build-number "${{ needs.version.outputs.number }}"
          mkdir -p ../dist
          tar -C build/linux/x64/release -czf \
            "../dist/lacre-${{ needs.version.outputs.name }}-linux-x64.tar.gz" \
            --transform 's/^bundle/lacre/' bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Diagnóstico: cargokit no muestra los errores de cargo en Windows.
      - name: Comprobar Rust
        run: cargo build --release --manifest-path app/rust/Cargo.toml
      - name: Compilar
        working-directory: app
        shell: bash
        run: |
          flutter pub get
          flutter build windows --release \
            --build-name "${{ needs.version.outputs.name }}" \
            --build-number "${{ needs.version.outputs.number }}"
          mkdir -p ../dist
          cd build/windows/x64/runner
          mv Release Lacre
          7z a "../../../../../dist/lacre-${{ needs.version.outputs.name }}-windows-x64.zip" Lacre
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Compilar
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release \
            --build-name "${{ needs.version.outputs.name }}" \
            --build-number "${{ needs.version.outputs.number }}"
          mkdir -p ../dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Lacre.app \
            "../dist/lacre-${{ needs.version.outputs.name }}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum * > SHA256SUMS.txt) && ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
