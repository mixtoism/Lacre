[package]
name = "lacre_api"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
flutter_rust_bridge = "=2.13.0"
lacre-node = { path = "../../crates/lacre-node" }
lacre-core = { path = "../../crates/lacre-core" }
tokio = { version = "1.53.2", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = { version = "0.1.44", features = ["log"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4.1"
ndk-context = "0.1.1"
android_logger = "0.15.1"
# En Android, tracing → log → logcat (el logger lo instala frb).
log = "0.4.34"

# Clave de datos del escritorio en el Secret Service (D-033).
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2.0", features = ["rt-tokio-crypto-rust"] }
rand = "0.8"
# Icono en la bandeja por D-Bus (StatusNotifierItem), sin libayatana (D-057).
ksni = { version = "0.3.8", default-features = false, features = ["tokio"] }

# Clave de datos en el Llavero de macOS y con DPAPI en Windows (D-042).
[target.'cfg(target_os = "macos")'.dependencies.security-framework]
version = "3"
[target.'cfg(target_os = "macos")'.dependencies.rand]
version = "0.8"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
rand = "0.8"

# En macOS, liblzma (lo usa Tor para descomprimir directorios) se enlazaría con
# la de Homebrew, que no entra en la biblioteca estática ni es universal.
[target.'cfg(target_os = "macos")'.dependencies]
liblzma = { version = "0.4.8", features = ["static"] }
