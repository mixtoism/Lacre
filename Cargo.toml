[workspace]
resolver = "2"
members = ["crates/p2m-core", "crates/p2m-node", "app/rust"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"

# Argon2 y la criptografía son muy lentos sin optimizar; el sufijo del handle
# tardaría segundos en debug.
[profile.dev.package."*"]
opt-level = 3
