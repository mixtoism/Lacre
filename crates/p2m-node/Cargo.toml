[package]
name = "p2m-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "onion-service-service", "static-sqlite"] }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
ed25519-dalek = "2"
futures = "0.3.34"
libp2p = { version = "0.57", features = ["tokio", "tcp", "quic", "noise", "yamux", "kad", "mdns", "identify", "request-response", "cbor", "macros", "ed25519", "relay", "dcutr", "upnp", "dns"] }
mainline = "8"
p2m-core = { version = "0.1.0", path = "../p2m-core" }
rand = "0.8"
safelog = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
tor-cell = "0.47"
tor-hsservice = "0.47"
tor-proto = "0.47"
tor-rtcompat = "0.47"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
